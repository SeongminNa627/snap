<!DOCTYPE html>
<html>
  <head>
    <title>Synonym Finder</title>
    <meta name="description" content="A Catalog of Synonyms" />
    <link rel="stylesheet" href="style.css" />
    <script src = "glove.50d.js"></script>
    <script type="text/javascript" src="scripts.js"></script>
    
  </head>

  <body>

    <header class="main-header">
      <h1 class="title">Synonym Finder</h1>
      
      
    </header>
    <div class = entry-box>
       <input class = "first-input-bar" type = "text" placeholder = "ex) Snap"  id = "first_search">
       <input class = "second-input-bar" type = "text" placeholder = "ex) Chat (optional)" id =  "second_search">
       <button class ="button" type = "submit" onclick = "showCards();"> Search </button>
       <p id= "demo"></p>
    </div>
    <label class = label-title id = "lb"> </label>
    <div id="card-container"></div>

    <div class="card" style="display: none">
      <div class="card-content">
        <h2>Title</h2>
        
        <p></p>
        <ul>
          <li>Bullet Point 1</li>
          <li>Bullet Point 2</li>
          <li>Bullet Point 3</li>
        </ul>
      </div>
    </div>
    <div class="footer">
      <button onclick="prevCard();">Prev</button>
      <button onclick="nextCard();">Next</button>
    </div>    

  </body>
</html>
